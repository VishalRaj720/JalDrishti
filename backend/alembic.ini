# Alembic configuration file

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# Last-resort fallback only. env.py prefers MIGRATION_DATABASE_URL, then
# DATABASE_URL, then the same two from backend/.env. This literal pointed at
# `groundwater_db_test` (a stray, unmigrated database) and would silently
# migrate the wrong one when no environment was set.
# Intentionally NOT a working credential. env.py resolves the connection from
# MIGRATION_DATABASE_URL, then DATABASE_URL, then the same two in backend/.env.
# This line is the last resort, and it should fail loudly rather than connect:
# a committed superuser password that silently works is how the wrong database
# gets migrated by someone who never set an environment.
sqlalchemy.url = postgresql+psycopg2://SET_MIGRATION_DATABASE_URL@localhost:5432/unset

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
